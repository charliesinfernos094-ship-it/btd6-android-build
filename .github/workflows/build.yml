name: Build MarLoader ARM64
on:
  workflow_dispatch:
jobs:
  build-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip cmake ninja-build
      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.3.13750724'
      - name: Extract project sources
        run: |
          mkdir source
          unzip -q projeto.zip -d source
          find source -name CMakeLists.txt -print
      - name: Compile ARM64 native library
        run: |
          SRC="$(find source -path '*/MarLoader-Android/Native/CMakeLists.txt' -print -quit)"
          test -n "$SRC" || { echo "CMakeLists.txt do MarLoader não encontrado"; exit 1; }
          cmake -S "$(dirname "$SRC")" -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24
          cmake --build build
      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: MarLoader-ARM64-native
          path: build/**/*.so
          if-no-files-found: error
